<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">pi_ppo_lstm network structure</title>
  <desc id="desc">A clean architecture diagram for pi_ppo_lstm. Observation features feed the actor LSTM, then split into an unchanged PPO actor path and a parallel path-integration bottleneck branch. Achieved goal is used only to generate fixed place-cell targets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef5ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a43" flood-opacity="0.12" />
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857" />
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c" />
    </marker>
    <style>
      .canvas { fill: url(#bg); }
      .title { font: 800 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 800 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; fill: #64748b; }
      .box { filter: url(#shadow); rx: 18; }
      .label { font: 800 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .text { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .muted { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .tag { font: 800 11px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.05em; fill: #334155; }
      .input { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .core { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .rl { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .pi { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .target { fill: #dcfce7; stroke: #059669; stroke-width: 2; }
      .loss { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; }
      .blue-line { fill: none; stroke: #1d4ed8; stroke-width: 3; marker-end: url(#arrow-blue); }
      .amber-line { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#arrow-amber); }
      .green-line { fill: none; stroke: #047857; stroke-width: 3; marker-end: url(#arrow-green); }
      .red-line { fill: none; stroke: #b91c1c; stroke-width: 3; marker-end: url(#arrow-red); }
      .blocked { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-dasharray: 7 7; }
      .divider { stroke: #dbe4f0; stroke-width: 1.5; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect class="canvas" width="1320" height="760" />

  <text class="title" x="56" y="58">pi_ppo_lstm Architecture</text>
  <text class="subtitle" x="56" y="84">Parallel path-integration auxiliary branch for PPO-LSTM. The actor MLP is not downstream of the PI bottleneck.</text>

  <line class="divider" x1="430" y1="120" x2="430" y2="650" />
  <line class="divider" x1="760" y1="120" x2="760" y2="650" />
  <line class="divider" x1="1040" y1="120" x2="1040" y2="650" />

  <text class="section" x="70" y="135">Inputs</text>
  <text class="section" x="470" y="135">Shared Recurrent Core</text>
  <text class="section" x="800" y="135">PPO Outputs</text>
  <text class="section" x="1080" y="135">Auxiliary Loss</text>

  <rect class="box input" x="70" y="170" width="270" height="118" />
  <text class="label" x="98" y="207">Policy Observation</text>
  <text class="text" x="98" y="234">PointMaze dict observation</text>
  <text class="muted" x="98" y="258">includes velocity/sensors/goal features</text>
  <rect x="98" y="266" width="188" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" />
  <text class="tag" x="113" y="282">drop achieved_goal</text>

  <rect class="box target" x="70" y="450" width="270" height="118" />
  <text class="label" x="98" y="487">Aux Target Position</text>
  <text class="text" x="98" y="514">achieved_goal</text>
  <text class="muted" x="98" y="538">used for target generation only</text>

  <rect class="box core" x="475" y="170" width="220" height="118" />
  <text class="label" x="509" y="207">Feature Extractor</text>
  <text class="text" x="509" y="234">CustomCombinedExtractor</text>
  <text class="muted" x="509" y="258">features for recurrent policy</text>

  <rect class="box core" x="475" y="330" width="220" height="118" />
  <text class="label" x="532" y="367">Actor LSTM</text>
  <text class="text" x="522" y="394">lstm_actor output</text>
  <text class="muted" x="545" y="418">latent_pi</text>

  <rect class="box rl" x="805" y="180" width="190" height="100" />
  <text class="label" x="849" y="218">Actor MLP</text>
  <text class="text" x="838" y="245">unchanged PPO path</text>

  <rect class="box rl" x="1085" y="180" width="170" height="100" />
  <text class="label" x="1125" y="218">Action Dist</text>
  <text class="text" x="1125" y="245">policy output</text>

  <rect class="box rl" x="805" y="330" width="190" height="100" />
  <text class="label" x="850" y="368">Critic Path</text>
  <text class="text" x="833" y="395">SB3-contrib recurrent</text>

  <rect class="box rl" x="1085" y="330" width="170" height="100" />
  <text class="label" x="1134" y="368">Value</text>
  <text class="text" x="1123" y="395">state estimate</text>

  <rect class="box pi" x="805" y="500" width="190" height="104" />
  <text class="label" x="844" y="538">PI Bottleneck</text>
  <text class="text" x="836" y="565">linear projection</text>
  <text class="muted" x="836" y="587">analysis target</text>

  <rect class="box pi" x="1085" y="500" width="170" height="104" />
  <text class="label" x="1122" y="538">PC Head</text>
  <text class="text" x="1112" y="565">place-cell logits</text>
  <text class="muted" x="1126" y="587">n cells</text>

  <rect class="box target" x="475" y="500" width="220" height="104" />
  <text class="label" x="509" y="538">Fixed PC Encoder</text>
  <text class="text" x="510" y="565">persistent centers</text>
  <text class="muted" x="503" y="587">in policy.state_dict()</text>

  <rect class="box loss" x="1085" y="635" width="170" height="68" />
  <text class="label" x="1129" y="663">PI Loss</text>
  <text class="text" x="1110" y="687">soft cross entropy</text>

  <path class="blue-line" d="M340 229 H475" />
  <path class="blue-line" d="M585 288 V330" />
  <path class="blue-line" d="M695 374 C742 374 765 230 805 230" />
  <path class="blue-line" d="M995 230 H1085" />
  <path class="blue-line" d="M695 391 C742 391 765 380 805 380" />
  <path class="blue-line" d="M995 380 H1085" />

  <path class="amber-line" d="M695 416 C742 416 762 552 805 552" />
  <path class="amber-line" d="M995 552 H1085" />

  <path class="green-line" d="M340 509 H475" />
  <path class="red-line" d="M695 552 H755 C780 552 780 670 1085 670" />
  <path class="red-line" d="M1170 604 V635" />

  <path class="blocked" d="M900 500 C900 470 900 430 900 280" />
  <line x1="885" y1="390" x2="915" y2="420" stroke="#ef4444" stroke-width="3" />
  <line x1="915" y1="390" x2="885" y2="420" stroke="#ef4444" stroke-width="3" />
  <text class="muted" x="916" y="411">no actor dependency</text>

  <rect class="note" x="70" y="650" width="900" height="54" />
  <text class="text" x="96" y="681">Current version: place-cell path integration only. Heading/HDC and start_pos-based LSTM initialization are intentionally left for later.</text>
</svg>
